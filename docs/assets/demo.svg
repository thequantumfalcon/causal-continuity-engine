<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect width="760" height="400" rx="10" fill="#161b22"/>
  <rect width="760" height="34" rx="10" fill="#21262d"/>
  <rect y="24" width="760" height="10" fill="#21262d"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="380" y="22" fill="#8b949e" text-anchor="middle" font-size="12">cce-engine — quickstart</text>
  <g fill="#e6edf3">
    <text x="24" y="66"><tspan fill="#7ee787">$</tspan> pip install causal-continuity-engine</text>
    <text x="24" y="96"><tspan fill="#7ee787">$</tspan> cce-engine init</text>
    <text x="24" y="122" fill="#8b949e">initialized CCE project <tspan fill="#79c0ff">prj_d6c38ceccaa64f112f6b0c45</tspan> (capture: redacted);</text>
    <text x="24" y="144" fill="#8b949e">local API credentials are in ~/demo/.cce/secrets</text>
    <text x="24" y="180"><tspan fill="#7ee787">$</tspan> cce-engine audit verify</text>
    <text x="24" y="206" fill="#8b949e">events: <tspan fill="#7ee787">INTACT</tspan> (0 entries)</text>
    <text x="24" y="228" fill="#8b949e">audit_log: <tspan fill="#7ee787">INTACT</tspan> (2 entries)</text>
    <text x="24" y="264"><tspan fill="#7ee787">$</tspan> cce-engine assumptions</text>
    <text x="24" y="290" fill="#8b949e">no assumptions</text>
    <text x="24" y="326"><tspan fill="#7ee787">$</tspan> cce-engine --json invalidations</text>
    <text x="24" y="352" fill="#8b949e">[]</text>
    <text x="24" y="382" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> <tspan fill="#484f58">▌</tspan></text>
  </g>
</svg>
